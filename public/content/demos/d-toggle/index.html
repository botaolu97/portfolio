<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toggle Button</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button type="button" class="toggle" role="switch" aria-checked="false" aria-label="Toggle">
      <span class="knob" aria-hidden="true"></span>
      <span class="label" aria-hidden="true">Off</span>
    </button>
    <script src="app.js"></script>
  </body>
</html>
